# Add to ~/.codex/config.toml (user) or .codex/config.toml (trusted project).
# Same as: codex mcp add train-snitch --env TRAIN_SNITCH_CONFIG_DIRS=/ABS/PATH/configs -- train-snitch-mcp
[mcp_servers.train-snitch]
command = "train-snitch-mcp"
args = []
# forwarded from the environment Codex runs in (names only; add your judge provider's key name if it uses one)
env_vars = ["TRAIN_SNITCH_CONFIG_DIRS", "TRAIN_SNITCH_OUT_DIRS", "TRAIN_SNITCH_ENV_FILE"]
startup_timeout_sec = 20
tool_timeout_sec = 60
enabled_tools = ["list_watches", "status", "latest", "tail_alerts", "check_config", "start_watch", "stop_watch", "meter"]
