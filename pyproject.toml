[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "train-snitch"
version = "0.2.0"
description = "A cheap, read-only watcher for ML training runs: deterministic rules every cycle, a small LLM judge (via the Pi agent harness, any Pi provider) and alerts a bigger agent can follow, with an MCP server for agent harnesses."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# the MCP stdio server for agent harnesses (official MCP Python SDK); the core stays stdlib-only
mcp = ["mcp>=2.0,<3"]

[project.scripts]
train-snitch = "train_snitch.__main__:main"
train-snitch-mcp = "train_snitch.mcp_server:main"

[tool.setuptools]
packages = ["train_snitch", "train_snitch.adapters", "train_snitch._judge"]

[tool.setuptools.package-dir]
# the Pi bridge + judge prompt ship inside the wheel as train_snitch/_judge (same files as judge/)
"train_snitch._judge" = "judge"

[tool.setuptools.package-data]
"train_snitch._judge" = ["*.mjs", "*.md"]
